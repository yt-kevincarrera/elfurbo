name: elfurbo
description: "El Furbo: estadísticas de fútbol entre amigos."
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  fl_chart: ^1.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  intl: any
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  crypto: ^3.0.6
  open_filex: ^4.7.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  expressive_loading_indicator: ^0.0.1
  material_new_shapes: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Letras de la pizarra (dentro de la app: Google Fonts no carga en Cuba).
  # Licencias en assets/fonts.
  fonts:
    - family: Marker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# Ícono de la app (la pizarra). Regenerar con:
#   flutter test tool/icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E2A24"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 23
